# ============================================================
#   G-Rise Plugin - Main Configuration
#   Plugin by _gengis | Paper 1.21+
# ============================================================

# ============================================================
# SECTION 1: DATABASE
# ============================================================
database:
  # Storage type: "sqlite" (file-based, no setup needed) or "mysql"
  type: sqlite

  sqlite:
    file-name: grise_data.db

  mysql:
    host: localhost
    port: 3306
    database: grise
    username: root
    password: changeme
    pool-size: 5
    connection-timeout: 30000
    use-ssl: false

# ============================================================
# SECTION 2: GAME MECHANICS
# ============================================================
game:
  countdown-seconds: 3
  max-players-per-arena: 8
  min-players-multiplayer: 2
  lobby-wait-timeout: 60

  # Ticks of inactivity before the fall-watch rescues a stuck player.
  # Easy → levitation rescue. Medium → levitation rescue. Hard → elimination.
  fall-watch-timeout-ticks: 60

  # Initial boost given at "GO!" (velocity upward + levitation).
  start-boost:
    enabled: true
    velocity-y: 1.5
    # Duration and strength of the START levitation only.
    levitation-ticks: 100
    levitation-amplifier: 2

  # Rescue levitation (separate from start boost — strong burst, short duration).
  # amplifier 9 = very fast upward, 40 ticks = 2 seconds (enough to reach next target).
  rescue-levitation-ticks: 40
  rescue-levitation-amplifier: 9

# ============================================================
# SECTION 3: DIFFICULTY SETTINGS
# ============================================================
difficulty:

  medium:
    # How many Mace hits a warden takes before disappearing.
    hits-per-entity: 5

  hard:
    # How long (ticks) each wave stays visible (20 = 1 s).
    entity-visible-ticks: 40
    # How often (ticks) a new wave is revealed.
    wave-interval-ticks: 60
    # How many entities per wave (closest to the player's height).
    wave-size: 3
    # Chain mode: only one entity visible at a time, next appears after hit.
    chain-mode: false
    # Sound + volume + pitch when a wave appears.
    spawn-sound: BLOCK_DISPENSER_LAUNCH
    spawn-sound-volume: 1.0
    spawn-sound-pitch: 1.4

# ============================================================
# SECTION 4: ENTITY / TARGET SPAWNING
# ============================================================
spawning:
  # Entity type used as targets (must be a valid EntityType name).
  entity-type: WARDEN

  # Maximum entities spawned at game start. Lower = cleaner arena.
  max-initial-entities: 12

  generation:
    # Vertical spacing between entities (min and max Y offset per slot).
    min-y-offset: 8
    max-y-offset: 8
    # Horizontal spread from the previous entity's position.
    max-horizontal-offset: 3
    min-horizontal-offset: 1

  # Hits before a Race-mode entity dies.
  multiplayer-entity-health: 5

# ============================================================
# SECTION 5: MACE / COMBO MECHANICS
# ============================================================
mace:
  # Base upward power per hit. Works in Survival AND Creative.
  # Range: 1.2 (gentle) → 2.5 (very powerful).
  wind-burst-power: 1.2

  # Extra multiplier on top of wind-burst-power (1.0 = no extra).
  wind-burst-multiplier: 1.2

  # Ascending-pitch sound on consecutive hits.
  combo-sound-enabled: true
  combo-sound: ENTITY_PLAYER_ATTACK_SWEEP
  combo-sound-base-pitch: 0.8
  combo-sound-pitch-step: 0.15
  combo-max-for-pitch: 10

# ============================================================
# SECTION 6: ARENA DEFAULTS
# ============================================================
arena:
  default-floor-y: 64
  default-goal-y: 164
  default-radius: 8
  win-sound: UI_TOAST_CHALLENGE_COMPLETE
  win-sound-volume: 1.0
  win-sound-pitch: 1.0

# ============================================================
# SECTION 7: LEADERBOARD & RECORDS
# ============================================================
leaderboard:
  top-entries: 10
  cache-refresh-seconds: 300

# ============================================================
# SECTION 8: MESSAGES
# ============================================================
messages:
  language: en_US

# ============================================================
# SECTION 9: HIT EFFECTS
# ============================================================
effects:
  hit-effects-enabled: true
  # Any Bukkit Particle name: CRIT, FLAME, EXPLOSION_EMITTER, SWEEP_ATTACK…
  hit-particle: FIRE
  hit-particle-count: 12
  # Sound at entity on each hit.
  hit-sound: ENTITY_GENERIC_EXPLODE
  hit-sound-volume: 0.6
  hit-sound-pitch: 1.8

# ============================================================
# SECTION 10: COMBO REWARDS
# ============================================================
rewards:
  # Set to true to enable milestone rewards.
  enabled: true

  # Milestones keyed by combo count.
  # title / subtitle: &-colour codes supported.
  # command: console command; use %player% for the player name. "" = no command.
  milestones:
    5:
      title: "&e&lCOMBO x5!"
      subtitle: "&7Nice streak!"
      command: ""
    10:
      title: "&6&lCOMBO x10!"
      subtitle: "&eYou're on fire!"
      command: ""
    25:
      title: "&c&lCOMBO x25!"
      subtitle: "&4Unstoppable!"
      command: "give %player% diamond 1"
    50:
      title: "&5&lCOMBO x50!!"
      subtitle: "&dLEGENDARY STREAK!"
      command: "give %player% diamond_block 1"